services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: invermin_backend
    restart: always
    env_file:
      - ./backend/.env.prod
    volumes:
      - /mnt/datos_invermin/storage:/mnt/datos_invermin/storage
    expose:
      - "8000"
    ports:
      - "8000:8000" # Opcional: expone el backend en el puerto 8000 para depuración externa o monitoreo directos

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invermin_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
