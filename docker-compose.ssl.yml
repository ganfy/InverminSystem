# docker-compose.ssl.yml
# Versión de producción con HTTPS habilitado (certificado auto-firmado o Let's Encrypt)
#
# Uso:
#   docker compose -f docker-compose.ssl.yml up -d --build
#
# Para detener:
#   docker compose -f docker-compose.ssl.yml down

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: invermin_backend
    restart: always
    env_file:
      - ./backend/.env.prod
    volumes:
      - /mnt/datos_invermin/storage:/mnt/datos_invermin/storage
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invermin_frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

  nginx-ssl:
    image: nginx:alpine
    container_name: invermin_nginx_ssl
    restart: always
    ports:
      - "80:80"    # Para redirección HTTP → HTTPS
      - "443:443"  # HTTPS
    volumes:
      # Usar nginx con cert auto-firmado (Opción B):
      - ./nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/invermin/ssl:/etc/nginx/ssl:ro
      # Para Let's Encrypt (Opción A), reemplazar por:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
