# Guía de configuración HTTPS — InverminSystem (Paititi)
# Archivo: nginx/nginx-ssl.conf
# Propósito: Nginx como reverse proxy con SSL/TLS para acceso desde móviles

# ── OPCIÓN ACTIVA: IP pública + certificado auto-firmado ─────────────────────
# (Sin dominio DNS — acceso por https://20.163.45.40)
# El navegador mostrará advertencia de cert la primera vez → Aceptar y continuar

server {
    listen 80;
    server_name _;
    # Redirigir HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 20.163.45.40;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Frontend (Vue SPA)
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}


